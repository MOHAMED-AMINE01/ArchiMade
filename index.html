<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Logo ArchiMade.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Per-route <title>/description/canonical/OG/Twitter are injected at build
       time by the <Seo> component (vite-react-ssg Head). -->
  <title>ArchiMade Studio</title>

  <!-- Progressive enhancement: without JS the entrance animations never run, so
       elements that start hidden (opacity:0 / framer initial state) would stay
       invisible and the preloader overlay would never fade. Force them visible
       for no-JS clients and crawlers. JS clients are unaffected. -->
  <noscript>
    <style>
      .archi-preloader { display: none !important; }
      .opacity-0 { opacity: 1 !important; }
      [style*="opacity:0"], [style*="opacity: 0"] { opacity: 1 !important; }
    </style>
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
